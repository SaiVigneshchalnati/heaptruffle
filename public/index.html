<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeapTruffle — Login</title>
    <meta name="description" content="AI-Assisted Browser Memory Forensics Platform — Secure Login" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" rel="stylesheet" />
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        :root{
            --bg:#080d1a;--surface:rgba(13,21,38,0.75);--glass-border:rgba(255,255,255,0.08);
            --purple:#8b5cf6;--pink:#ec4899;--text:#e8edf8;--muted:#7a8caa;--dim:#4a5a73;
        }
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
            min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
        .bg-glow{position:fixed;pointer-events:none;border-radius:50%;filter:blur(120px);opacity:0.18;}
        .glow-1{width:600px;height:600px;background:var(--purple);top:-150px;left:-200px;}
        .glow-2{width:500px;height:500px;background:var(--pink);bottom:-100px;right:-150px;}
        .login-card{
            position:relative;z-index:10;width:100%;max-width:420px;
            background:var(--surface);backdrop-filter:blur(24px);
            border:1px solid var(--glass-border);border-radius:24px;
            padding:2.5rem 2rem;box-shadow:0 24px 60px rgba(0,0,0,0.5);
        }
        .brand{text-align:center;margin-bottom:2rem;}
        .brand-logo{font-size:2rem;font-weight:800;letter-spacing:-0.5px;}
        .brand-logo span{background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .brand-sub{font-size:0.78rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.1em;}
        .form-group{margin-bottom:1.1rem;}
        label{display:block;font-size:0.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:0.5rem;}
        .input-wrap{position:relative;}
        .input-wrap i{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--dim);font-size:1.1rem;}
        input{width:100%;background:rgba(8,13,26,0.6);border:1px solid var(--glass-border);
            border-radius:12px;padding:0.8rem 1rem 0.8rem 2.8rem;
            color:var(--text);font-family:inherit;font-size:0.95rem;outline:none;
            transition:border-color 0.2s;}
        input:focus{border-color:var(--purple);}
        input::placeholder{color:var(--dim);}
        .btn-login{
            width:100%;padding:0.9rem;border:none;border-radius:12px;
            background:linear-gradient(135deg,var(--purple),var(--pink));
            color:#fff;font-family:inherit;font-size:1rem;font-weight:700;
            cursor:pointer;margin-top:0.5rem;letter-spacing:0.02em;
            transition:opacity 0.2s,transform 0.2s;
        }
        .btn-login:hover{opacity:0.9;transform:translateY(-1px);}
        .btn-login:active{transform:translateY(0);}
        .btn-login:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
        .error-msg{background:rgba(255,59,48,0.12);border:1px solid rgba(255,59,48,0.3);
            border-radius:10px;padding:0.7rem 1rem;font-size:0.85rem;color:#ff6b6b;
            margin-bottom:1rem;display:none;}
        .error-msg.show{display:block;}
        .hint{text-align:center;font-size:0.78rem;color:var(--dim);margin-top:1.2rem;}
        .hint span{color:var(--purple);font-weight:600;}
        .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);
            border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
        @keyframes spin{to{transform:rotate(360deg);}}
    </style>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="login-card">
        <div class="brand">
            <div class="brand-logo">Heap<span>Truffle</span></div>
            <div class="brand-sub">Memory Forensics Platform</div>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <div class="input-wrap">
                    <i class="uil uil-user"></i>
                    <input type="text" id="username" placeholder="admin" autocomplete="username" required />
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <i class="uil uil-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
                </div>
            </div>
            <button type="submit" class="btn-login" id="login-btn">Sign In</button>
        </form>
        <p class="hint">Default: <span>admin</span> / <span>admin@123</span></p>
    </div>

    <script>
        // If already logged in, redirect
        if (localStorage.getItem('ht_token')) window.location.href = '/app.html';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errEl = document.getElementById('error-msg');
            errEl.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Signing in...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value,
                    }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Login failed.');
                localStorage.setItem('ht_token', data.token);
                localStorage.setItem('ht_user', JSON.stringify(data.user));
                window.location.href = '/app.html';
            } catch (err) {
                errEl.textContent = err.message;
                errEl.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        });
    </script>
</body>
</html>
